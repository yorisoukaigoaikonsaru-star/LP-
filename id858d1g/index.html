<style>
  :root{
    --paper:#F8FAFC;
    --paper-soft:#FFFFFF;
    --ink:#334155;
    --pine:#2F6F62;
    --pine-deep:#204B42;
    --coral:#E8794A;
    --coral-deep:#C85F32;
    --line:#E2E8F0;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{font-family:'Noto Sans JP', sans-serif;background:var(--paper);color:var(--ink);line-height:1.8;}
  img{max-width:100%;display:block;}
  a{color:inherit;text-decoration:none;transition:0.3s;}
  .wrap{max-width:1000px;margin:0 auto;padding:0 24px;}
  
  /* ヘッダー */
  .top-bar{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:100;}
  .top-bar .wrap{display:flex;align-items:center;justify-content:space-between;height:70px;}
  .office-name{font-weight:700;font-size:1.2rem;color:var(--pine-deep);}
  .tel-btn{background:var(--pine);color:#fff;padding:10px 24px;border-radius:4px;font-weight:700;}
  
  /* ヒーロー */
  .hero{padding:80px 0;background:#fff;}
  .hero .wrap{display:flex;gap:40px;align-items:center;}
  .hero-text{flex:1;}
  .eyebrow{color:var(--coral);font-weight:700;border:1px solid var(--coral);padding:4px 12px;border-radius:20px;font-size:0.85rem;}
  .hero h1{font-size:2.2rem;margin:20px 0;color:var(--pine-deep);line-height:1.4;}
  .hero-photo-img{flex:1;aspect-ratio:4/3;object-fit:cover;border-radius:8px;}

  /* 共通見出し */
  .section-title{text-align:center;font-size:1.8rem;color:var(--pine-deep);margin-bottom:40px;font-weight:700;}
  .section-title::after{content:'';display:block;width:60px;height:4px;background:var(--coral);margin:16px auto 0;}

  /* 各セクション共通の白背景パネル */
  .panel-section{padding:80px 0;}
  .card-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px;}
  .card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:30px;box-shadow:0 4px 6px rgba(0,0,0,0.02);}
  
  .reason-num{color:var(--coral);font-size:1.5rem;font-weight:700;margin-bottom:12px;display:block;}
  .gallery-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;}
  .gallery-grid img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:4px;}

  /* フロー */
  .flow-steps{list-style:none;max-width:700px;margin:0 auto;}
  .flow-steps li{background:#fff;border:1px solid var(--line);margin-bottom:16px;padding:24px;border-radius:4px;display:flex;gap:20px;align-items:center;}
  .step-num{background:var(--pine);color:#fff;width:40px;height:40px;display:flex;align-items:center;justify-content:center;font-weight:700;border-radius:50%;flex-shrink:0;}

  /* 採用・フッター */
  .recruit{background:var(--pine-deep);color:#fff;padding:80px 0;text-align:center;}
  .recruit .tel-btn-white{background:#fff;color:var(--pine-deep);padding:14px 40px;border-radius:4px;font-weight:700;display:inline-block;margin-top:24px;}
  footer{background:var(--ink);color:#fff;padding:60px 0;text-align:center;}

  @media(max-width:820px){
    .hero .wrap{flex-direction:column;}
    .hero-photo-img{width:100%;}
  }
</style>
