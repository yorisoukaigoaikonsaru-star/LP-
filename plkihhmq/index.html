<style>
  :root{
    --paper:#FFFDF7;
    --paper-soft:#FFF5E1;
    --ink:#4A3F35;
    --pine:#B5622A;
    --pine-deep:#D88E3E; /* Warm theme custom */
    --coral:#FF7B54;
    --coral-deep:#E2592F;
    --line:#F0E4D3;
    --accent: #FFD56B;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{
    font-family:'Zen Maru Gothic', sans-serif;
    background:var(--paper);
    color:var(--ink);
    line-height:1.8;
  }
  img{max-width:100%;display:block;}
  a{color:inherit;text-decoration:none;transition:all 0.3s;}
  .wrap{max-width:1000px;margin:0 auto;padding:0 20px;}
  
  /* ポップなアニメーション */
  .bounce-in { opacity: 0; transform: scale(0.9); transition: opacity 0.6s ease, transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }
  .bounce-in.is-visible { opacity: 1; transform: scale(1); }

  /* ---------- ヘッダー ---------- */
  .top-bar{ position:sticky;top:0;z-index:50;background:#fff; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
  .top-bar .wrap{display:flex;align-items:center;justify-content:space-between;height:70px;}
  .top-bar .office-name{font-weight:900;font-size:1.3rem;color:var(--coral-deep);}
  .tel-btn{
    background:var(--coral);color:#fff;padding:10px 24px;border-radius:999px;
    font-weight:700;font-size:1rem; box-shadow: 0 4px 0 var(--coral-deep);
  }
  .tel-btn:active { transform: translateY(4px); box-shadow: 0 0 0 transparent; }

  /* ---------- ヒーロー ---------- */
  .hero{ position:relative;padding:80px 0 100px; background: radial-gradient(circle at right top, var(--paper-soft), var(--paper)); }
  .hero .wrap{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center;}
  .eyebrow { background: var(--accent); color: var(--ink); padding: 4px 16px; border-radius: 20px; font-weight: 700; font-size: 0.9rem; display: inline-block; margin-bottom: 20px; }
  .hero h1{font-size:clamp(1.8rem,3.5vw,2.8rem);line-height:1.5;font-weight:900; color: var(--ink);}
  .hero .lead{font-size:1.1rem; margin-top: 20px; font-weight: 500;}
  .hero-photo-img{ aspect-ratio:4/3;border-radius:30px;object-fit:cover; border: 6px solid #fff; box-shadow: 0 10px 25px rgba(0,0,0,0.08); width:100%; transform: rotate(2deg); }

  /* セクション共通 */
  .section-title { text-align: center; font-size: 2rem; font-weight: 900; margin-bottom: 50px; position: relative; }
  .section-title::before { content: '✨'; position: absolute; top: -20px; left: 50%; transform: translateX(-50%); font-size: 1.5rem; }

  /* ---------- 共感セクション ---------- */
  .empathy{background:var(--coral);color:#fff;padding:80px 0; border-radius: 40px 40px 0 0; margin-top: -30px; position: relative; z-index: 10;}
  .empathy .section-title::before { content: '💬'; }
  .worry-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:20px;}
  .worry-card{flex:1 1 280px;max-width:364px;}
  .worry-card{ background:#fff; color:var(--ink); border-radius:24px; padding:24px; font-size:1rem; font-weight: 700; text-align: center; box-shadow: 0 8px 0 rgba(0,0,0,0.1); }

  /* ---------- 選ばれる理由 ---------- */
  .reasons{padding:100px 0; background: var(--paper-soft);}
  .reason-list{display:flex;flex-wrap:wrap;justify-content:center;gap:30px;}
  .reason-card{flex:1 1 280px;max-width:364px;}
  .reason-card{ background:#fff; border-radius:30px; padding:40px 30px; text-align: center; box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
  .reason-num{ width: 50px; height: 50px; background: var(--accent); color: var(--ink); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; font-weight: 900; margin: 0 auto 20px; }
  .reason-card h3{font-size:1.3rem;margin-bottom:12px; font-weight: 900;}

  /* ---------- 施設の特徴・ギャラリー・スタッフ ---------- */
  .facility-features, .gallery {padding:80px 0; background: var(--paper);}
  .gallery-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:20px;}
  .gallery-grid img{flex:1 1 280px;max-width:364px;}
  .gallery-grid img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:24px; border: 4px solid #fff; box-shadow: 0 8px 15px rgba(0,0,0,0.05);}
  
  .staff {background:var(--paper-soft);padding:80px 0;}
  .staff-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:24px;}
  .staff-card{flex:1 1 240px;max-width:312px;}
  .staff-card{background:#fff;border-radius:24px;padding:30px; text-align: center; border: 2px dashed var(--line);}
  .staff-photo{ width:90px;height:90px;border-radius:50%;background:var(--accent); margin:0 auto 16px;overflow:hidden} .staff-photo img{width:100%;height:100%;object-fit:cover;display:block;}
  .staff-card .role{font-size:0.85rem;color:var(--coral);font-weight:700; background: #FFF0EB; display: inline-block; padding: 4px 12px; border-radius: 20px; margin-bottom: 12px;}
  .staff-card .name{font-weight:900;font-size:1.2rem;margin-bottom:12px;}

  /* ---------- 利用の流れ ---------- */
  .flow{padding:100px 0; background: #fff;}
  .flow-steps{list-style:none;counter-reset:step; max-width: 600px; margin: 0 auto;}
  .flow-steps li{ counter-increment:step;position:relative;padding:24px 0 24px 70px; background: var(--paper-soft); margin-bottom: 20px; border-radius: 20px; }
  .flow-steps li::before{
    content:counter(step);position:absolute;left:20px;top:28px;width:36px;height:36px;
    border-radius:50%;background:var(--coral);color:#fff;display:flex;align-items:center;
    justify-content:center;font-size: 1.1rem;font-weight:900;
  }
  .flow-steps .step-title{font-weight:900;font-size: 1.1rem; margin-bottom:4px;}

  /* ---------- 料金・エリア ---------- */
  .info{background:var(--paper-soft);padding:80px 0;}
  .info-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:20px;}
  .info-card{flex:1 1 280px;max-width:364px;}
  .info-card{background:#fff;border-radius:24px;padding:24px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.03);}
  .info-card .label{font-size:0.9rem; background: var(--accent); display: inline-block; padding: 4px 16px; border-radius: 20px; margin-bottom:12px; font-weight: 700;}
  .info-card .value{font-size:1.1rem;font-weight:900;}

  /* ---------- お知らせ ---------- */
  .news{padding:80px 0; background: #fff;}
  .news-list{list-style:none; max-width: 700px; margin: 0 auto; background: var(--paper-soft); border-radius: 24px; padding: 30px;}
  .news-item{border-bottom:2px dotted var(--line);padding:20px 0;}
  .news-item:last-child{border-bottom:none;}
  .news-title{font-weight:900;font-size:1.1rem; color: var(--coral-deep);}

  /* ---------- 採用 ---------- */
  .recruit{background:var(--accent);color:var(--ink);padding:80px 0; text-align: center;}
  .recruit h2{font-size:1.8rem; font-weight: 900;}
  .recruit p{font-size:1.05rem; font-weight: 700; margin: 16px 0 30px;}
  .recruit .tel-btn-white{ background:var(--ink);color:#fff;padding:16px 40px;border-radius:999px; font-weight:900; display: inline-block; box-shadow: 0 6px 0 rgba(0,0,0,0.2); }
  .recruit .tel-btn-white:active { transform: translateY(6px); box-shadow: 0 0 0 transparent; }

  /* ---------- フッター ---------- */
  footer{background:var(--ink);color:#fff;padding:60px 0 40px; text-align: center;}
  footer .office-name{font-size:1.5rem;margin-bottom:30px; font-weight: 900;}
  footer .foot-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:20px;font-size:0.95rem; margin-bottom: 40px; text-align: left;}
  footer .foot-grid div{flex:1 1 200px;max-width:260px;}
  footer .foot-grid div span{display:block;color:var(--accent);font-size:0.8rem; font-weight: 700; margin-bottom:4px;}
  .copyright{font-size:0.85rem; opacity: 0.7;}

  /* 追従LINEボタン */
  .floating-line { position: fixed; bottom: 20px; right: 20px; background: #06C755; color: #fff; width: 70px; height: 70px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2.2rem; box-shadow: 0 4px 15px rgba(6, 199, 85, 0.4); z-index: 100; transition: transform 0.3s; }
  .floating-line:hover { transform: scale(1.1); }

  @media (max-width:820px){
    .hero .wrap{grid-template-columns:1fr; text-align: center;}
    .hero-photo-img{order:-1; transform: rotate(0);}
    .floating-line { bottom: 15px; right: 15px; width: 60px; height: 60px; font-size: 1.8rem; }
  }
  /* ---------- よくある質問 (FAQ) ---------- */
  .faq{background:var(--paper-soft);padding:76px 0;}
  .faq h2{font-size:1.6rem;margin-bottom:30px;}
  .faq-item{background:#fff;border-radius:12px;margin-bottom:16px;padding:20px 24px;border:1px solid var(--line);}
  .faq-q{font-weight:700;color:var(--pine-deep);margin-bottom:12px;position:relative;padding-left:32px;font-size:1.05rem;}
  /* 158・160行目付近の修正後（CSS） */
.faq-q::before{content:'Q.';position:absolute;left:0;color:var(--coral);font-family:'Zen Maru Gothic', sans-serif;font-size:1.4rem;top:-4px; font-weight:900;}
.faq-a::before{content:'A.';position:absolute;left:0;color:var(--pine);font-family:'Zen Maru Gothic', sans-serif;font-size:1.4rem;top:-4px; font-weight:900;}
  
  /* ---------- SNSボタン ---------- */
  .sns-wrap { display: flex; gap: 8px; margin-left: auto; }
  .sns-btn{display:inline-flex;align-items:center;justify-content:center;padding:8px 16px;border-radius:999px;font-weight:700;font-size:.85rem;color:#fff !important;text-decoration:none;transition:opacity 0.2s;}
  .sns-btn:hover{opacity:0.8;}
  .line-btn{background:#06C755;}
  .insta-btn{background:linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);}
  
  @media (max-width:820px){
    .sns-wrap { display: none; } /* スマホではヘッダーのSNSボタンを隠す等の調整 */
  }
</style>
</head>

<script>
  document.addEventListener("DOMContentLoaded", function() {
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('is-visible');
        }
      });
    }, { threshold: 0.1 });

    document.querySelectorAll('.bounce-in').forEach(el => {
      observer.observe(el);
    });
  });
</script>
